
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake Game 🐍</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #101827, #172d27);
      font-family: Arial, sans-serif;
      color: white;
      padding: 20px;
    }

    .game {
      width: 100%;
      max-width: 460px;
      text-align: center;
      background: #1b2938;
      padding: 24px;
      border-radius: 20px;
      border: 1px solid #34485b;
      box-shadow: 0 15px 40px #0005;
    }

    h1 {
      color: #4ade80;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #a8bac9;
      margin-bottom: 20px;
      font-size: 14px;
    }

    .scoreboard {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .score-box {
      background: #101c29;
      padding: 12px;
      border-radius: 10px;
      flex: 1;
    }

    .score-box span {
      display: block;
      color: #a8bac9;
      font-size: 12px;
      margin-bottom: 5px;
    }

    .score-box strong {
      font-size: 22px;
      color: #4ade80;
    }

    canvas {
      width: 100%;
      height: auto;
      display: block;
      background: #0d1921;
      border: 2px solid #34485b;
      border-radius: 10px;
      touch-action: none;
    }

    #message {
      min-height: 25px;
      margin: 14px 0;
      color: #facc15;
      font-weight: bold;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 12px 18px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      transform: scale(1.04);
    }

    .start-btn {
      background: #4ade80;
      color: #102019;
      width: 100%;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(3, 55px);
      grid-template-rows: repeat(2, 45px);
      justify-content: center;
      gap: 6px;
      margin-top: 18px;
    }

    .controls button {
      padding: 8px;
      background: #34485b;
      color: white;
      font-size: 20px;
    }

    .controls button:active {
      background: #4ade80;
      color: #102019;
    }

    .up {
      grid-column: 2;
      grid-row: 1;
    }

    .left {
      grid-column: 1;
      grid-row: 2;
    }

    .down {
      grid-column: 2;
      grid-row: 2;
    }

    .right {
      grid-column: 3;
      grid-row: 2;
    }

    .help {
      color: #a8bac9;
      font-size: 12px;
      line-height: 1.6;
      margin-top: 18px;
    }
  </style>
</head>

<body>
  <main class="game">
    <h1>🐍 Snake Game</h1>
    <p class="subtitle">Makan apel, tumbuh lebih panjang!</p>

    <div class="scoreboard">
      <div class="score-box">
        <span>SKOR</span>
        <strong id="score">0</strong>
      </div>
      <div class="score-box">
        <span>SKOR TERTINGGI</span>
        <strong id="highScore">0</strong>
      </div>
    </div>

    <canvas id="board" width="400" height="400"></canvas>

    <p id="message">Tekan Mulai untuk bermain!</p>

    <button class="start-btn" id="startBtn">
      ▶ Mulai Game
    </button>

    <div class="controls">
      <button class="up" data-dir="up">▲</button>
      <button class="left" data-dir="left">◀</button>
      <button class="down" data-dir="down">▼</button>
      <button class="right" data-dir="right">▶</button>
    </div>

    <p class="help">
      Keyboard: ↑ ↓ ← → atau W A S D<br>
      Tekan Spasi untuk jeda
    </p>
  </main>

  <script>
    const canvas = document.getElementById("board");
    const ctx = canvas.getContext("2d");
    const scoreText = document.getElementById("score");
    const highScoreText = document.getElementById("highScore");
    const message = document.getElementById("message");
    const startBtn = document.getElementById("startBtn");

    const tile = 20;
    const tiles = canvas.width / tile;

    let snake;
    let food;
    let dx;
    let dy;
    let nextDx;
    let nextDy;
    let score = 0;
    let highScore = 0;
    let timer = null;
    let running = false;
    let paused = false;
    let gameOver = false;

    try {
      highScore = Number(localStorage.getItem("snakeHighScore")) || 0;
    } catch (e) {}

    highScoreText.textContent = highScore;

    function resetGame() {
      snake = [
        { x: 10, y: 10 },
        { x: 9, y: 10 },
        { x: 8, y: 10 }
      ];

      dx = 1;
      dy = 0;
      nextDx = 1;
      nextDy = 0;
      score = 0;
      running = true;
      paused = false;
      gameOver = false;

      scoreText.textContent = score;
      message.textContent = "Ayo makan apel! 🍎";
      startBtn.textContent = "⏸ Jeda Game";

      placeFood();
      draw();
      runGame();
    }

    function placeFood() {
      do {
        food = {
          x: Math.floor(Math.random() * tiles),
          y: Math.floor(Math.random() * tiles)
        };
      } while (
        snake.some(part => part.x === food.x && part.y === food.y)
      );
    }

    function draw() {
      ctx.fillStyle = "#0d1921";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Garis kotak
      ctx.strokeStyle = "#182832";
      ctx.lineWidth = 1;

      for (let i = 0; i <= tiles; i++) {
        ctx.beginPath();
        ctx.moveTo(i * tile, 0);
        ctx.lineTo(i * tile, canvas.height);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(0, i * tile);
        ctx.lineTo(canvas.width, i * tile);
        ctx.stroke();
      }

      // Apel
      ctx.fillStyle = "#fb4b4b";
      ctx.beginPath();
      ctx.arc(
        food.x * tile + tile / 2,
        food.y * tile + tile / 2,
        tile * 0.4,
        0,
        Math.PI * 2
      );
      ctx.fill();

      ctx.fillStyle = "#4ade80";
      ctx.fillRect(food.x * tile + 11, food.y * tile + 2, 3, 7);

      // Ular
      snake.forEach((part, index) => {
        ctx.fillStyle = index === 0 ? "#86efac" : "#22c55e";

        ctx.beginPath();
        ctx.roundRect(
          part.x * tile + 1,
          part.y * tile + 1,
          tile - 2,
          tile - 2,
          5
        );
        ctx.fill();

        if (index === 0) {
          ctx.fillStyle = "#102019";

          let eye1x = part.x * tile + 6;
          let eye2x = part.x * tile + 14;
          let eyeY = part.y * tile + 6;

          if (dx === 1) {
            eye1x = part.x * tile + 14;
            eye2x = part.x * tile + 14;
            eyeY = part.y * tile + 6;
          } else if (dx === -1) {
            eye1x = part.x * tile + 6;
            eye2x = part.x * tile + 6;
            eyeY = part.y * tile + 6;
          } else if (dy === 1) {
            eye1x = part.x * tile + 6;
            eye2x = part.x * tile + 14;
            eyeY = part.y * tile + 14;
          } else {
            eye1x = part.x * tile + 6;
            eye2x = part.x * tile + 14;
            eyeY = part.y * tile + 6;
          }

          ctx.beginPath();
          ctx.arc(eye1x, eyeY, 2, 0, Math.PI * 2);
          ctx.arc(eye2x, eyeY, 2, 0, Math.PI * 2);
          ctx.fill();
        }
      });
    }

    function runGame() {
      clearInterval(timer);

      if (!running || paused || gameOver) return;

      const speed = Math.max(65, 150 - score * 2);

      timer = setInterval(() => {
        update();
      }, speed);
    }

    function update() {
      if (!running || paused || gameOver) return;

      dx = nextDx;
      dy = nextDy;

      const head = {
        x: snake[0].x + dx,
        y: snake[0].y + dy
      };

      // Tabrak dinding
      if (
        head.x < 0 ||
        head.x >= tiles ||
        head.y < 0 ||
        head.y >= tiles
      ) {
        endGame();
        return;
      }

      const eating = head.x === food.x && head.y === food.y;

      // Jika tidak makan, ekor bergerak sehingga petak ekor lama
      // boleh dimasuki.
      const body = eating ? snake : snake.slice(0, -1);

      if (body.some(part => part.x === head.x && part.y === head.y)) {
        endGame();
        return;
      }

      snake.unshift(head);

      if (eating) {
        score += 10;
        scoreText.textContent = score;

        if (score > highScore) {
          highScore = score;
          highScoreText.textContent = highScore;

          try {
            localStorage.setItem("snakeHighScore", highScore);
          } catch (e) {}
        }

        placeFood();
        message.textContent = "Mantap! +10 poin 🍎";
        runGame();
      } else {
        snake.pop();
      }

      draw();
    }

    function endGame() {
      gameOver = true;
      running = false;
      clearInterval(timer);
      message.textContent = "Game Over! Skor kamu: " + score;
      startBtn.textContent = "🔄 Main Lagi";
      draw();
    }

    function changeDirection(direction) {
      if (!running || paused || gameOver) return;

      if (direction === "up" && dy !== 1) {
        nextDx = 0;
        nextDy = -1;
      } else if (direction === "down" && dy !== -1) {
        nextDx = 0;
        nextDy = 1;
      } else if (direction === "left" && dx !== 1) {
        nextDx = -1;
        nextDy = 0;
      } else if (direction === "right" && dx !== -1) {
        nextDx = 1;
        nextDy = 0;
      }
    }

    function togglePause() {
      if (!running || gameOver) return;

      paused = !paused;

      if (paused) {
        clearInterval(timer);
        message.textContent = "Game dijeda ⏸";
        startBtn.textContent = "▶ Lanjutkan";
      } else {
        message.textContent = "Lanjut bermain!";
        startBtn.textContent = "⏸ Jeda Game";
        runGame();
      }
    }

    startBtn.addEventListener("click", () => {
      if (gameOver || !running) {
        resetGame();
      } else {
        togglePause();
      }
    });

    document.addEventListener("keydown", event => {
      const key = event.key.toLowerCase();

      const keys = [
        "arrowup", "arrowdown", "arrowleft", "arrowright", " "
      ];

      if (keys.includes(key)) event.preventDefault();

      if (key === "arrowup" || key === "w") {
        changeDirection("up");
      } else if (key === "arrowdown" || key === "s") {
        changeDirection("down");
      } else if (key === "arrowleft" || key === "a") {
        changeDirection("left");
      } else if (key === "arrowright" || key === "d") {
        changeDirection("right");
      } else if (key === " ") {
        togglePause();
      }
    });

    document.querySelectorAll("[data-dir]").forEach(button => {
      button.addEventListener("click", () => {
        changeDirection(button.dataset.dir);
      });
    });

    // Tampilan awal
    snake = [
      { x: 10, y: 10 },
      { x: 9, y: 10 },
      { x: 8, y: 10 }
    ];

    food = { x: 15, y: 10 };
    dx = 1;
    dy = 0;
    draw();
  </script>
</body>
</html>
